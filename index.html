
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050805">
<title>Failoria Games</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #050805;
    color: #eaffea;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

header {
    padding: 25px 20px;
    text-align: center;
    border-bottom: 1px solid #17351c;
    background: #080e09;
}

.logo {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #65ff79;
    text-shadow: 0 0 15px #1aff45;
}

.subtitle {
    color: #79977e;
    margin-top: 8px;
    font-size: 13px;
}

main {
    max-width: 1000px;
    margin: auto;
    padding: 25px 16px;
}

.section-title {
    font-size: 21px;
    margin-bottom: 18px;
}

.games {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
}

.game {
    min-height: 155px;
    border: 1px solid #24552c;
    border-radius: 15px;
    background: linear-gradient(145deg, #101d12, #080d09);
    padding: 18px;
    text-decoration: none;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: 0.2s;
}

.game:active {
    transform: scale(0.97);
}

.game:hover {
    border-color: #65ff79;
    box-shadow: 0 0 18px #1aff4530;
}

.game-icon {
    font-size: 34px;
}

.game-name {
    font-size: 18px;
    font-weight: bold;
    margin-top: 12px;
}

.game-description {
    font-size: 12px;
    color: #91a995;
    margin-top: 6px;
}

.play {
    color: #65ff79;
    font-size: 12px;
    font-weight: bold;
    margin-top: 15px;
}

.coming {
    opacity: 0.65;
}

footer {
    text-align: center;
    color: #536957;
    font-size: 12px;
    padding: 35px 10px;
}

@media (min-width: 650px) {
    .games {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">FAILORIA GAMES</div>
    <div class="subtitle">Игровая платформа Failoria</div>
</header>

<main>
    <h2 class="section-title">Все игры</h2>

    <div class="games">

        <a class="game" href="casino.html">
            <div>
                <div class="game-icon">🎰</div>
                <div class="game-name">Casino</div>
                <div class="game-description">
                    Игровой автомат с виртуальными очками
                </div>
            </div>
            <div class="play">ИГРАТЬ →</div>
        </a>

        <div class="game coming">
            <div>
                <div class="game-icon">🧱</div>
                <div class="game-name">Game 2</div>
                <div class="game-description">
                    Новая игра появится здесь
                </div>
            </div>
            <div class="play">СКОРО</div>
        </div>

        <div class="game coming">
            <div>
                <div class="game-icon">🚀</div>
                <div class="game-name">Game 3</div>
                <div class="game-description">
                    Новая игра появится здесь
                </div>
            </div>
            <div class="play">СКОРО</div>
        </div>

    </div>
</main>

<footer>
    FAILORIA © 2026
</footer>

</body>
</html>
